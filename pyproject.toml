[project]
name = "nctui"
version = "0.1.0"
description = "Rapid terminal viewer for weather and climate model netCDF output"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Alex Corbett" }]
dependencies = [
    "textual>=8.2",
    "netCDF4>=1.7",
    "cftime>=1.6",
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[project.scripts]
nctui = "nctui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nctui"]

# --------------------------------------------------------------------------- pixi

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.14"
textual = ">=8.2"
netcdf4 = ">=1.7"
cftime = ">=1.6"
numpy = ">=2.0"
matplotlib-base = ">=3.9"

[tool.pixi.pypi-dependencies]
nctui = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = ">=8"
pytest-asyncio = ">=1.0"
xarray = ">=2025.1"  # tests write their sample files with it
ruff = ">=0.6"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
prod = { features = [], solve-group = "default" }

[tool.pixi.tasks]
nctui = "nctui"
test = "pytest"
lint = "ruff check src tests scripts"

# --------------------------------------------------------------------------- tools

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
